name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create the vX.Y.Z tag and draft release from the version in tauri.conf.json'
        type: boolean
        default: false

# Separate manual test builds and release builds so each can supersede only
# runs of the same kind on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release && 'release' || 'test' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test-e2e:
    name: E2E Tests
    if: inputs.release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # --with-deps runs its own apt-get update; strip the same third-party
        # sources the Linux dependency steps strip, or a broken mirror kills it.
        # Third-party apt sources on the runner image (Microsoft, Google Chrome)
        # break apt-get update whenever their mirror is inconsistent, and none
        # is used here. Match by host: the file names differ between images.
        run: |
          (sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' /etc/apt/sources.list.d/ || true) | xargs -r sudo rm -f
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          overwrite: true
          retention-days: 14

  build:
    name: Build (${{ matrix.name }})
    needs: [test-e2e]
    if: ${{ !cancelled() && (!inputs.release || needs.test-e2e.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-ARM64
            bundles: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
            bundles: deb,appimage,rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            bundles: msi,nsis

    runs-on: ${{ matrix.platform }}
    env:
      BUNDLE_DIR: src-tauri/target/${{ matrix.target }}/release/bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          env-vars: ImageOS

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          (sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' /etc/apt/sources.list.d/ || true) | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Manual test builds use the platform's installer formats and skip signing.
      - name: Build Tauri app
        if: ${{ !inputs.release }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign

      # tauri-action creates the draft for the version in tauri.conf.json.
      # The manual trigger keeps publishing that draft from rebuilding its assets.
      - name: Build Tauri app (Release)
        if: inputs.release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Gitduda v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build MSIX package (Microsoft Store)
        id: build-msix
        if: runner.os == 'Windows' && inputs.release && vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/build-msix.ps1 -Target ${{ matrix.target }}

      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: ./.github/actions/upload-installer
        with:
          path: ${{ env.BUNDLE_DIR }}/dmg/*.dmg

      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: ./.github/actions/upload-installer
        with:
          path: ${{ env.BUNDLE_DIR }}/deb/*.deb

      - name: Upload AppImage
        if: runner.os == 'Linux'
        uses: ./.github/actions/upload-installer
        with:
          path: ${{ env.BUNDLE_DIR }}/appimage/*.AppImage

      - name: Upload RPM package
        if: runner.os == 'Linux'
        uses: ./.github/actions/upload-installer
        with:
          path: ${{ env.BUNDLE_DIR }}/rpm/*.rpm

      - name: Upload MSI installer
        if: runner.os == 'Windows'
        uses: ./.github/actions/upload-installer
        with:
          path: ${{ env.BUNDLE_DIR }}/msi/*.msi

      - name: Upload NSIS installer
        if: runner.os == 'Windows'
        uses: ./.github/actions/upload-installer
        with:
          path: ${{ env.BUNDLE_DIR }}/nsis/*.exe

      - name: Upload MSIX package
        if: steps.build-msix.outcome == 'success'
        uses: ./.github/actions/upload-installer
        with:
          path: Gitduda_*_x64.msix

  # tauri-action writes api.github.com/repos/.../releases/assets/<id> URLs into
  # latest.json when releaseDraft is true. Rewrite them to direct
  # /releases/download/vX.Y.Z/<name> URLs once all matrix builds finish so
  # publishing the draft release from the GitHub UI works immediately.
  finalize-release:
    name: Normalize updater manifest
    needs: [build]
    if: inputs.release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Rewrite latest.json asset URLs to direct download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh api "repos/${{ github.repository }}/releases?per_page=20" \
            | jq -e --arg tag "$tag" 'map(select(.tag_name == $tag)) | first' > release.json
          if ! jq -e '.assets[] | select(.name == "latest.json")' release.json >/dev/null; then
            echo "::notice::No latest.json asset in $tag (updater disabled); skipping normalization."
            exit 0
          fi
          gh release download "$tag" -p latest.json --clobber
          status=$(node .github/scripts/normalize-latest-json.mjs \
            --latest latest.json \
            --release release.json \
            --repo "${{ github.repository }}")
          if [ "$status" = "updated" ]; then
            gh release upload "$tag" latest.json --clobber
          fi
          cat latest.json
